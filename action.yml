name: "GhostAction History Sweeper"
description: >-
  Defensive mirror of the GhostAction v2 payload: diffs every commit in a repo's git history for leaked secrets (AWS keys, GitHub tokens, API keys) so you can rotate them before an attacker does. Fails CI when historical leaks are found. By Ingenious AI.
author: "Ingenious AI"

branding:
  icon: "search"
  color: "red"

inputs:
  since:
    description: Only scan commits after this date (e.g. 2025-01-01). Empty = full history.
    required: false
    default: ""
  fail-on-findings:
    description: "'true' (default): fail the build when leaked secrets are found in history."
    required: false
    default: "true"

outputs:
  verdict:
    description: CLEAN or LEAKS-FOUND.
    value: ${{ steps.scan.outputs.verdict }}
  findings-count:
    description: Number of historical secret findings.
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Run GhostAction History Sweeper
      id: scan
      shell: bash
      run: |
        set -u
        export FAIL_ON_F="${{ inputs.fail-on-failure }}"
        python3 "${{ github.action_path }}/src/history_sweeper.py" --repo "${{ github.workspace }}" --output "$RUNNER_TEMP/sweep-report.md" $([ -n "${{ inputs.since }}" ] && printf -- "--since %s" "${{ inputs.since }}") > "$RUNNER_TEMP/scan-stdout.txt" 2> "$RUNNER_TEMP/scan-stderr.txt" || true
        echo '' | base64 -d > "$RUNNER_TEMP/eval.py"
        python3 "$RUNNER_TEMP/eval.py"
    - name: Fail on findings
      shell: bash
      if: steps.scan.outputs.failed == 'true'
      run: |
        echo "::error::GhostAction History Sweeper reported findings above the fail threshold."
        exit 1
